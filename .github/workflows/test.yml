name: test

on: [push, pull_request]

jobs:
  shims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU wheels: the shim tests fall back to CPU when no GPU is present.
      # They check numerical agreement with dense references, which is
      # device-independent.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy
      - run: python tests/test_shims.py
      # The step counter has no dependencies at all, and a wrong count is
      # worse than no count, so it is checked on every push.
      - run: python tests/test_steps.py
      # **What this runner reports, checked against the contract.** The model
      # is replaced by a stand-in, so this needs no GPU, no weights and nothing
      # installed - which is the point: a result key that quietly changes name
      # is not an error anywhere downstream, it just loses the settings.
      - run: python tests/test_result_shape.py
