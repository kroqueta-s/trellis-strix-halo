name: test

on: [push, pull_request]

jobs:
  shims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CPU wheels: the shim tests fall back to CPU when no GPU is present.
      # They check numerical agreement with dense references, which is
      # device-independent.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy
      - run: python tests/test_shims.py
