[project]
name = "hearth"
version = "0.0.0"
description = "TRELLIS runner for AMD Strix Halo (gfx1151) on Windows ROCm"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]
